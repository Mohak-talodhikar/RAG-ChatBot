<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="50" y="10" width="1000" height="60" rx="10" fill="#0f172a"/>

  <text x="550" y="35" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">RAG Chatbot — Architecture</text>

  <text x="550" y="60" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94a3b8">How data flows through the system</text>

  <line x1="50" y1="80" x2="1050" y2="80" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ==================== UPLOAD PATH ==================== -->
  <text x="50" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">UPLOAD PATH</text>
  <text x="50" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b">POST /upload — builds the RAG chain</text>

  <rect x="50" y="155" width="120" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="185" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#1e40af">PDF File</text>

  <line x1="170" y1="180" x2="200" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="200" y="155" width="130" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="265" y="185" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#1e40af">PyPDFLoader</text>

  <line x1="330" y1="180" x2="360" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="360" y="155" width="140" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="178" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#1e40af">Text Splitter</text>
  <text x="430" y="195" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b">1000 / 200 overlap</text>

  <line x1="500" y1="180" x2="530" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="530" y="155" width="140" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="178" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#1e40af">Embeddings</text>
  <text x="600" y="195" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b">MiniLM-L6-v2</text>

  <line x1="670" y1="180" x2="700" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="700" y="155" width="120" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="760" y="185" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#1e40af">FAISS</text>

  <line x1="820" y1="180" x2="850" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="850" y="155" width="130" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="915" y="178" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#1e40af">Retriever</text>
  <text x="915" y="195" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b">k = 3</text>

  <line x1="980" y1="180" x2="1010" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1010" y="155" width="80" height="50" rx="8" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1050" y="185" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">qa_chain</text>

  <!-- ==================== QUERY PATH ==================== -->
  <text x="50" y="265" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#059669">QUERY PATH</text>
  <text x="50" y="285" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b">POST /ask — uses the RAG chain</text>

  <rect x="50" y="305" width="120" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="110" y="335" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#065f46">Question</text>

  <line x1="170" y1="330" x2="200" y2="330" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="200" y="305" width="100" height="50" rx="8" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="250" y="335" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">qa_chain</text>

  <line x1="300" y1="330" x2="330" y2="330" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="330" y="305" width="110" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="385" y="335" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#065f46">Retriever</text>

  <line x1="440" y1="330" x2="470" y2="330" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="470" y="305" width="120" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="530" y="335" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#065f46">format_docs</text>

  <line x1="590" y1="330" x2="620" y2="330" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="620" y="305" width="110" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="675" y="335" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#065f46">Prompt</text>

  <line x1="730" y1="330" x2="760" y2="330" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="760" y="305" width="130" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="825" y="328" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#065f46">FLAN-T5</text>
  <text x="825" y="345" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b">small</text>

  <line x1="890" y1="330" x2="920" y2="330" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="920" y="305" width="130" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="985" y="328" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#065f46">clean_response</text>
  <text x="985" y="345" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b">dedup + strip</text>

  <line x1="1050" y1="330" x2="1050" y2="380" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="980" y="380" width="140" height="40" rx="8" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="1050" y="405" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Answer</text>

  <!-- ==================== STORAGE ==================== -->
  <text x="50" y="470" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">STORAGE</text>
  <text x="50" y="490" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b">Persists chat history across restarts</text>

  <rect x="50" y="510" width="200" height="60" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="150" y="535" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#334155">SQLite</text>
  <text x="150" y="555" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b">chats.db</text>

  <rect x="280" y="510" width="150" height="60" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="355" y="535" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#334155">conversations</text>
  <text x="355" y="555" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b">id, title, pdf</text>

  <rect x="460" y="510" width="150" height="60" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="535" y="535" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#334155">messages</text>
  <text x="535" y="555" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b">role, content</text>

  <!-- ==================== CONNECTIONS TO STORAGE ==================== -->
  <line x1="1050" y1="205" x2="1050" y2="510" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="1060" y="360" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8" transform="rotate(90, 1060, 360)">save conversation</text>

  <line x1="250" y1="355" x2="250" y2="510" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="260" y="440" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8" transform="rotate(90, 260, 440)">save messages</text>

  <!-- ==================== LEGEND ==================== -->
  <rect x="700" y="510" width="350" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="720" y="535" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#334155">Legend:</text>
  <rect x="780" y="522" width="14" height="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="800" y="534" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#334155">Upload</text>
  <rect x="860" y="522" width="14" height="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="880" y="534" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#334155">Query</text>
  <rect x="940" y="522" width="14" height="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="960" y="534" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#334155">Storage</text>
  <line x1="780" y1="552" x2="810" y2="552" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="820" y="556" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#334155">Async save</text>
</svg>