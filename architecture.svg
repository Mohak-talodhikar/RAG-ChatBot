<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#34d399"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)" rx="16"/>

  <text x="600" y="45" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="bold" fill="#f8fafc">System Architecture</text>
  <text x="600" y="75" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#94a3b8">RAG Chatbot — End-to-End Data Flow</text>

  <!-- ==================== FRONTEND ==================== -->
  <rect x="40" y="110" width="300" height="180" rx="12" fill="#1e293b" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="140" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#60a5fa">FRONTEND</text>
  <text x="190" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94a3b8">Port 3000</text>

  <rect x="70" y="180" width="240" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="190" y="210" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#e2e8f0">Chat UI</text>

  <rect x="70" y="245" width="110" height="35" rx="6" fill="#2563eb" opacity="0.2"/>
  <text x="125" y="267" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#60a5fa">Upload PDF</text>

  <rect x="200" y="245" width="110" height="35" rx="6" fill="#0891b2" opacity="0.2"/>
  <text x="255" y="267" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#22d3ee">Ask Question</text>

  <!-- ==================== BACKEND ==================== -->
  <rect x="400" y="110" width="560" height="560" rx="12" fill="#1e293b" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="140" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#a78bfa">BACKEND — FastAPI</text>
  <text x="680" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94a3b8">Port 8000</text>

  <!-- Upload Path -->
  <rect x="430" y="185" width="120" height="50" rx="8" fill="#7c3aed" opacity="0.15" stroke="#7c3aed" stroke-width="1"/>
  <text x="490" y="215" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#c4b5fd">/upload</text>

  <rect x="580" y="185" width="140" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="650" y="207" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#e2e8f0">Text Splitter</text>
  <text x="650" y="224" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">1000 / 200 overlap</text>

  <rect x="750" y="185" width="140" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="820" y="207" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#e2e8f0">Embeddings</text>
  <text x="820" y="224" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">MiniLM-L6-v2</text>

  <rect x="430" y="260" width="120" height="50" rx="8" fill="#0891b2" opacity="0.15" stroke="#0891b2" stroke-width="1"/>
  <text x="490" y="290" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#22d3ee">/ask</text>

  <rect x="580" y="260" width="140" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="650" y="282" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#e2e8f0">FAISS Search</text>
  <text x="650" y="299" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">Top 3 chunks</text>

  <rect x="750" y="260" width="140" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="820" y="282" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#e2e8f0">Prompt</text>
  <text x="820" y="299" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">Context + Query</text>

  <rect x="430" y="340" width="180" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="520" y="365" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#e2e8f0">FAISS Vector Store</text>
  <text x="520" y="385" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94a3b8">In-Memory Index</text>

  <rect x="660" y="340" width="180" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="750" y="365" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#e2e8f0">FLAN-T5-small</text>
  <text x="750" y="385" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94a3b8">HuggingFace LLM</text>

  <rect x="430" y="430" width="180" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="520" y="455" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#e2e8f0">LangChain</text>
  <text x="520" y="475" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94a3b8">LCEL RAG Chain</text>

  <rect x="660" y="430" width="180" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="750" y="455" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#e2e8f0">clean_response</text>
  <text x="750" y="475" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94a3b8">Dedup + Strip</text>

  <!-- Models box -->
  <rect x="430" y="520" width="410" height="120" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="635" y="545" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#94a3b8">MODELS LOADED AT STARTUP</text>

  <rect x="450" y="560" width="170" height="55" rx="8" fill="#1e293b" stroke="#2563eb" stroke-width="1"/>
  <text x="535" y="585" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#60a5fa">sentence-transformers</text>
  <text x="535" y="603" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">all-MiniLM-L6-v2</text>

  <rect x="660" y="560" width="160" height="55" rx="8" fill="#1e293b" stroke="#7c3aed" stroke-width="1"/>
  <text x="740" y="585" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#a78bfa">transformers</text>
  <text x="740" y="603" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">flan-t5-small</text>

  <!-- ==================== DATABASE ==================== -->
  <rect x="1000" y="340" width="160" height="120" rx="12" fill="#1e293b" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="370" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#34d399">SQLite</text>
  <text x="1080" y="395" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94a3b8">chats.db</text>
  <text x="1080" y="425" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b">Conversations</text>
  <text x="1080" y="445" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b">Messages</text>

  <!-- ==================== ARROWS ==================== -->
  <!-- Upload flow -->
  <line x1="180" y1="245" x2="180" y2="200" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="180" y1="180" x2="490" y2="180" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowBlue)"/>
  <text x="335" y="170" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#60a5fa">PDF file</text>

  <line x1="550" y1="210" x2="580" y2="210" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="720" y1="210" x2="750" y2="210" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="820" y1="235" x2="820" y2="260" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- Ask flow -->
  <line x1="255" y1="245" x2="255" y2="200" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <line x1="255" y1="180" x2="490" y2="180" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowCyan)"/>
  <text x="372" y="165" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#22d3ee">Query</text>

  <line x1="550" y1="285" x2="580" y2="285" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="720" y1="285" x2="750" y2="285" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="820" y1="310" x2="820" y2="340" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="820" y1="400" x2="750" y2="400" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="660" y1="400" x2="520" y2="400" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="520" y1="340" x2="520" y2="340" stroke="#a78bfa" stroke-width="2"/>
  <line x1="610" y1="370" x2="660" y2="370" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="750" y1="430" x2="750" y2="430" stroke="#a78bfa" stroke-width="2"/>
  <line x1="660" y1="460" x2="610" y2="460" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- Response back to frontend -->
  <line x1="660" y1="460" x2="370" y2="460" stroke="#34d399" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGreen)"/>
  <line x1="370" y1="460" x2="370" y2="200" stroke="#34d399" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGreen)"/>
  <text x="370" y="500" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#34d399">Answer</text>

  <!-- DB persistence -->
  <line x1="840" y1="580" x2="1000" y2="580" stroke="#34d399" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGreen)"/>
  <text x="920" y="570" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#34d399">Save</text>

  <line x1="1000" y1="400" x2="840" y2="400" stroke="#34d399" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGreen)"/>
  <text x="920" y="390" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#34d399">Load</text>

  <!-- ==================== LEGEND ==================== -->
  <rect x="40" y="520" width="300" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="190" y="545" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#94a3b8">LEGEND</text>

  <line x1="70" y1="570" x2="120" y2="570" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="135" y="575" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94a3b8">Upload Flow</text>

  <line x1="70" y1="600" x2="120" y2="600" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="135" y="605" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94a3b8">Query Flow</text>

  <line x1="70" y1="630" x2="120" y2="630" stroke="#34d399" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGreen)"/>
  <text x="135" y="635" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94a3b8">Response / Storage</text>

  <text x="70" y="660" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b">Solid = Sync</text>
  <text x="180" y="660" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b">Dashed = Async</text>
</svg>